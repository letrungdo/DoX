name: Build Flutter Android, iOS, and macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to build"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: write
  actions: read

env:
  XCODE_VERSION: "26.6"
  BUILD_ENV: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  build-android:
    runs-on: macos-26
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate environment files
        uses: ./.github/actions/generate-env-files
        with:
          environment: ${{ env.BUILD_ENV }}
          dart_define_base64: ${{ secrets.DART_DEFINE_BASE64 }}
          google_services_base64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
          google_service_info_base64: ${{ secrets.GOOGLE_SERVICE_INFO_BASE64 }}

      - name: Get version from pubspec.yaml
        id: get_version
        uses: ./.github/actions/get-pubspec-version

      - name: Decode keystore and create jks and properties file for signing the app
        run: |
          sed -i '' -e 's/signingConfigs.getByName("debug")/signingConfigs.getByName("release")/' app/build.gradle.kts
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/keystore.jks
          echo "storeFile=keystore.jks" >> key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        working-directory: android

      # Set up Java for Android build
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml

      - name: Setup FlutterFire
        run: dart pub global activate flutterfire_cli

      # Build Android APK
      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define-from-file envs/${{ env.BUILD_ENV }}/dart-define.env \
            --obfuscate --split-debug-info=build/obfuscate

      # Upload APK as release asset
      - name: Upload APK to Release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/app-release.apk
          asset_name: app-release.apk
          tag: ${{ steps.get_version.outputs.version }}
          release_name: ${{ steps.get_version.outputs.version }}
          target_commit: ${{ github.sha }}
          overwrite: true

  build-ios:
    runs-on: macos-26
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate environment files
        uses: ./.github/actions/generate-env-files
        with:
          environment: ${{ env.BUILD_ENV }}
          dart_define_base64: ${{ secrets.DART_DEFINE_BASE64 }}
          google_services_base64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
          google_service_info_base64: ${{ secrets.GOOGLE_SERVICE_INFO_BASE64 }}

      - name: Get version from pubspec.yaml
        id: get_version
        uses: ./.github/actions/get-pubspec-version

      - name: Set XCode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml

      - name: Setup FlutterFire
        run: dart pub global activate flutterfire_cli

      - name: Prepare iOS dependencies
        run: |
          flutter pub get
          bash scripts/patch-easy-video-editor.sh

      # Build an unsigned iOS app and package it as an IPA.
      # This artifact must be signed later before it can be installed on a device
      # or distributed through the App Store.
      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign \
            --dart-define-from-file envs/${{ env.BUILD_ENV }}/dart-define.env \
            --obfuscate --split-debug-info=build/obfuscate

          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry do_x.ipa Payload

      # Upload IPA as release asset
      - name: Upload IPA to Release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/ipa/do_x.ipa
          asset_name: do_x.ipa
          tag: ${{ steps.get_version.outputs.version }}
          release_name: ${{ steps.get_version.outputs.version }}
          target_commit: ${{ github.sha }}
          overwrite: true

  build-macos:
    runs-on: macos-26
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate environment files
        uses: ./.github/actions/generate-env-files
        with:
          environment: ${{ env.BUILD_ENV }}
          dart_define_base64: ${{ secrets.DART_DEFINE_BASE64 }}
          google_services_base64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
          google_service_info_base64: ${{ secrets.GOOGLE_SERVICE_INFO_BASE64 }}

      - name: Get version from pubspec.yaml
        id: get_version
        uses: ./.github/actions/get-pubspec-version

      - name: Set XCode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml

      - name: Build macOS app
        run: |
          # Create a temporary xcconfig to disable signing
          echo "CODE_SIGNING_ALLOWED=NO" > temp.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> temp.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> temp.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER=" >> temp.xcconfig
          
          export XCODE_XCCONFIG_FILE=$(pwd)/temp.xcconfig
          
          flutter build macos --release \
            --dart-define-from-file envs/${{ env.BUILD_ENV }}/dart-define.env \
            --obfuscate --split-debug-info=build/obfuscate

      - name: Package DMG
        run: |
          app_path="build/macos/Build/Products/Release/Do X.app"
          staging_path="build/macos/dmg"

          test -d "$app_path"
          mkdir -p "$staging_path"
          ditto "$app_path" "$staging_path/Do X.app"
          ln -s /Applications "$staging_path/Applications"

          hdiutil create \
            -volname "Do X" \
            -srcfolder "$staging_path" \
            -format UDZO \
            -ov \
            "build/macos/do-x.dmg"

      - name: Upload DMG to Release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/macos/do-x.dmg
          asset_name: do-x.dmg
          tag: ${{ steps.get_version.outputs.version }}
          release_name: ${{ steps.get_version.outputs.version }}
          target_commit: ${{ github.sha }}
          overwrite: true

  update-release-notes:
    needs:
      - build-android
      - build-ios
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from pubspec.yaml
        id: get_version
        uses: ./.github/actions/get-pubspec-version

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.get_version.outputs.version }}
        run: |
          previous_tag="$({
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          } | while IFS= read -r tag; do
            if [[ "$tag" != "$CURRENT_TAG" ]]; then
              echo "$tag"
              break
            fi
          done)"

          if [[ -n "$previous_tag" ]]; then
            git rev-parse --verify "${previous_tag}^{commit}"
            commit_range="${previous_tag}..${GITHUB_SHA}"
          else
            commit_range="${GITHUB_SHA}"
          fi

          commit_notes="$(git log --no-merges --format='- %s (`%h`)' "$commit_range")"

          {
            echo "## Changes"
            echo
            if [[ -n "$commit_notes" ]]; then
              echo "$commit_notes"
            else
              echo "No non-merge commits since the previous release."
            fi
          } > release-notes.md

          gh release edit "$CURRENT_TAG" \
            --title "$CURRENT_TAG" \
            --notes-file release-notes.md
