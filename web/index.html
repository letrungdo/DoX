<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Do X">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Do X">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Do X</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script" fetchpriority="high">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      /* The app's dark background, whatever the device's dark mode says: the
         page is painted before the app can tell which theme it was put in,
         and a light one in front of someone running it dark is a white flash
         on every load. */
      background: #16201e;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 24px;
      color: #2dd4bf;
      font: 500 14px system-ui, sans-serif;
    }

    #app-loading img {
      width: 72px;
      height: 72px;
    }

    #app-loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgb(45 212 191 / 25%);
      border-top-color: #2dd4bf;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading-spinner { animation-duration: 1600ms; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Đang tải Do X">
    <img src="icons/Icon-192.png" alt="" width="72" height="72">
    <div id="app-loading-spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
